name: MaxCX packages
on:
  workflow_dispatch:
  push:
    branches: ['build/personal-packages']
permissions:
  contents: read
concurrency:
  group: personal-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-14, platform: darwin-arm64}
          - {runner: macos-15-intel, platform: darwin-amd64}
          - {runner: ubuntu-22.04, platform: linux-amd64}
          - {runner: ubuntu-22.04-arm, platform: linux-arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-bundle.txt
      - name: Unit tests in isolated home
        shell: bash
        run: |
          test_home=$(mktemp -d)
          HOME="$test_home" python -m pytest -q
      - name: Stamp X build identity
        run: |
          python -c 'import json,subprocess; from pathlib import Path; Path("src/maxc_cli/x_build.json").write_text(json.dumps({"version":"0.9.4-x.1","commit":subprocess.check_output(["git","rev-parse","--short=12","HEAD"],text=True).strip()}))'
      - name: Build using upstream bundler
        run: bash scripts/build_release.sh
      - name: Smoke test standalone runtime in isolated home
        shell: bash
        run: |
          test_home=$(mktemp -d)
          HOME="$test_home" python -m pytest tests/test_pyinstaller_bundle.py -q
      - name: Verify extracted archive without project Python
        shell: bash
        run: |
          stage=$(mktemp -d)
          tar -xzf dist/release/maxc.tar.gz -C "$stage"
          test_home=$(mktemp -d)
          env -i HOME="$test_home" PATH=/usr/bin:/bin "$stage/maxc/maxc" --version
          env -i HOME="$test_home" PATH=/usr/bin:/bin "$stage/maxc/maxc" agent manifest --json > "$stage/manifest.json"
          python -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "success"' "$stage/manifest.json"
      - name: Package MaxCX executable
        shell: bash
        run: |
          mv dist/maxc/maxc dist/maxc/maxcx
          mv dist/maxc dist/maxcx
          COPYFILE_DISABLE=1 tar -czf dist/release/maxcx.tar.gz -C dist maxcx
          rm dist/release/maxc.tar.gz*
          test_home=$(mktemp -d)
          HOME="$test_home" dist/maxcx/maxcx --version | grep "0.9.4-x.1+"
          HOME="$test_home" dist/maxcx/maxcx job wait --help | grep maxcx
      - name: Record source and dependency versions
        shell: bash
        run: |
          git rev-parse HEAD > dist/release/SOURCE_COMMIT
          python --version > dist/release/PYTHON_VERSION
          python -m pip freeze > dist/release/BUILD_DEPENDENCIES.txt
          cd dist/release
          shasum -a 256 maxcx.tar.gz SOURCE_COMMIT PYTHON_VERSION BUILD_DEPENDENCIES.txt > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: personal-maxc-${{ matrix.platform }}-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
